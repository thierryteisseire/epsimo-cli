[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epsimo"
version = "0.3.0"
description = "Epsimo AI Agent Framework CLI — build, deploy, and chat with AI assistants"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "Thierry Teisseire"}]
keywords = ["ai", "agent", "cli", "assistant", "epsimo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "requests>=2.28.0",
    "pyyaml>=6.0",
]

[project.scripts]
epsimo = "epsimo.cli:main"

[project.urls]
Homepage = "https://github.com/thierryteisseire/epsimo-agent"
Repository = "https://github.com/thierryteisseire/epsimo-agent"

[tool.setuptools.packages.find]
include = ["epsimo*"]

[tool.setuptools.package-data]
epsimo = ["tools/*.yaml", "templates/**/*"]
